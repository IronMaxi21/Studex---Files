name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Back end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studex-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the "node": ">=20" engine in package.json.
          node-version: 20
          cache: npm
          cache-dependency-path: studex-server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # The suite sets its own environment in test/setup.ts and never reads
        # .env, so there is nothing to configure here.
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studex-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studex-server/package-lock.json

      - run: npm ci

      - name: Install Chromium
        # Only the one browser: these tests are about the app's own flows, not
        # about rendering differences, and the app itself only ever runs in
        # WebKit inside a WKWebView.
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        # The config starts the real server against a throwaway database and
        # serves the app's own web/ from it, so there is nothing to set up here.
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studex-server/test-results/
          retention-days: 7

  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse every ES module
        # Syntax only — the modules are never executed, so browser globals are
        # irrelevant. This is the check build-app.sh refuses to package without.
        run: studex-mac/build/check-js.sh

  shell:
    name: Mac shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the Swift sources
        # -parse stops before type checking, so this needs no SDK wiring and
        # still catches a syntax error that would otherwise only surface in a
        # full 143 MB app build.
        run: swiftc -parse studex-mac/App/*.swift
